# Controlled Mod Agent Platform - Configuration
# Phase A keeps business behavior stubbed and side effects blocked.
# RAG-oriented settings below are preserved for the future Evidence Knowledge
# Subsystem and should not be treated as the top-level product goal.

project:
  name: "controlled-mod-agent-platform"
  phase: "A"
  default_domain: "gtfo"

workflow:
  control_plane: "langgraph"
  business_nodes: "stubbed"

safety:
  confirmed_write_default: false
  external_side_effect_default: false
  generated_mods_access: "blocked"

domain:
  first_validation_target: "gtfo"
  extensible_to:
    - "unity"
    - "bepinex"
    - "harmony"

knowledge:
  db_path: "./data/knowledge/knowledge.db"
  default_source_type: "target_source"
  indexable_extensions:
    - ".cs"
    - ".py"
    - ".json"
    - ".yaml"
    - ".yml"
    - ".md"
    - ".txt"
    - ".log"

evidence:
  default_top_k: 10
  readiness_levels:
    - "sufficient"
    - "partial"
    - "insufficient"
    - "contradictory"
  quick_patch_allows_text_evidence: true

planning:
  default_route: "standard_feature"
  ambiguous_request_min_terms: 2
  high_risk_keywords:
    - "enemy"
    - "damage"
    - "hook"
    - "harmony"
    - "il2cpp"
    - "runtime"
    - "gameplay"

proposal:
  default_permission_level: "dry_run_write"
  forbidden_path_parts:
    - ".git"
    - ".env"
    - "secrets"

# =============================================================================
# LLM Configuration
# =============================================================================
llm:
  provider: "openai"  # Options: openai, azure, ollama, deepseek
  model: "gpt-4o"
  deployment_name: "gpt-4o"
  azure_endpoint: "https://YOUR_ENDPOINT.openai.azure.com/"
  api_version: "2024-02-15-preview"
  api_key: "YOUR_API_KEY_HERE"
  temperature: 0.0
  max_tokens: 4096

# =============================================================================
# Embedding Configuration
# =============================================================================
embedding:
  provider: "openai"  # Options: openai, azure, ollama
  model: "text-embedding-ada-002"
  dimensions: 1536  # text-embedding-ada-002 固定维度 (不传递给API, 仅用于验证)
  # Azure-compatible settings (azure_endpoint triggers Azure compat mode):
  azure_endpoint: "https://YOUR_ENDPOINT.openai.azure.com/"
  deployment_name: "text-embedding-ada-002"
  api_version: "2024-02-15-preview"
  api_key: "YOUR_API_KEY_HERE"
  # OpenAI-specific settings (if provider is openai):
  # api_key: "YOUR_API_KEY_HERE"

# =============================================================================
# Vision LLM Configuration (for Image Captioning)
# =============================================================================
vision_llm:
  enabled: true  # Set to true to enable vision capabilities
  provider: "openai"  # Options: openai, azure, ollama
  model: "gpt-4o"  # Options: gpt-4o, gpt-4-vision-preview (OpenAI), llava (Ollama)
  # Azure-compatible settings (azure_endpoint triggers Azure compat mode):
  azure_endpoint: "https://YOUR_ENDPOINT.openai.azure.com/"
  deployment_name: "gpt-4o"
  api_version: "2024-02-15-preview"
  api_key: "YOUR_API_KEY_HERE"
  # Ollama-specific settings (if provider is ollama):
  # base_url: "http://localhost:11434"
  max_image_size: 2048  # Max dimension (width/height) for image compression

# =============================================================================
# Vector Store Configuration
# =============================================================================
vector_store:
  provider: "chroma"  # Options: chroma, qdrant, pinecone
  persist_directory: "./data/db/chroma"
  collection_name: "knowledge_hub"

# =============================================================================
# Retrieval Configuration
# =============================================================================
retrieval:
  dense_top_k: 20
  sparse_top_k: 20
  fusion_top_k: 10
  rrf_k: 60  # RRF constant

# =============================================================================
# Rerank Configuration
# =============================================================================
rerank:
  enabled: false
  provider: "none"  # Options: none, cross_encoder, llm
  model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  top_k: 5

# =============================================================================
# Evaluation Configuration
# =============================================================================
evaluation:
  enabled: false
  provider: "custom"  # Options: ragas, deepeval, custom
  metrics:
    - "hit_rate"
    - "mrr"
    - "faithfulness"

# =============================================================================
# Observability Configuration
# =============================================================================
observability:
  log_level: "INFO"  # Options: DEBUG, INFO, WARNING, ERROR
  trace_enabled: true
  trace_file: "./logs/traces.jsonl"
  structured_logging: true

# =============================================================================
# Controlled-Agent Performance Budget Configuration
# =============================================================================
performance:
  operations:
    indexing:
      max_items: 1000
      max_batches: 20
      max_duration_ms: 60000
      max_concurrency: 1
      cache_enabled: true
      on_exceed: "degrade"
    retrieval:
      max_api_calls: 0
      max_items: 20
      max_duration_ms: 5000
      max_concurrency: 1
      cache_enabled: true
      on_exceed: "block"
    eval:
      max_api_calls: 0
      max_batches: 5
      max_duration_ms: 30000
      max_concurrency: 1
      cache_enabled: false
      on_exceed: "block"
    captions:
      max_api_calls: 0
      max_items: 10
      max_duration_ms: 30000
      max_concurrency: 1
      cache_enabled: true
      on_exceed: "degrade"
    tool_call:
      max_api_calls: 0
      max_duration_ms: 10000
      max_concurrency: 1
      cache_enabled: false
      on_exceed: "block"

# =============================================================================
# Ingestion Configuration
# =============================================================================
ingestion:
  chunk_size: 1000
  chunk_overlap: 200
  splitter: "recursive"  # Options: recursive, semantic, fixed_length
  batch_size: 100
  
  # Chunk Refiner Configuration (C5)
  chunk_refiner:
    use_llm: true  # Set to true to enable LLM-based refinement (requires LLM config)
    # When use_llm is false or LLM call fails, falls back to rule-based refinement
  
  # Metadata Enricher Configuration (C6)
  metadata_enricher:
    use_llm: true  # Set to true to enable LLM-based enrichment (requires LLM config)
    # When use_llm is false or LLM call fails, falls back to rule-based enrichment
