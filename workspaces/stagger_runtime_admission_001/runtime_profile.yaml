      disabled_config_sha256: "39d4daceb08612078dcba7131c2d043ded0217b89495746816c68afae16f4e0d"
      enabled_config_path: "C:/Users/10160/.codex/worktrees/f4d6/MODULAR-RAG-MCP-SERVER-main/workspaces/stagger_runtime_admission_001/configs/general_enabled_true.cfg"
      enabled_config_sha256: "0d36b4b52c29dd784c9c3580a05fae7923bf5cc1a6cda4cb2493b5891848d660"

llm:
  provider: "openai"
  model: "qwen3.6-plus"
  temperature: 0.0
  max_tokens: 4096

embedding:
  provider: "openai"
  model: "text-embedding-ada-002"
  dimensions: 1536

vector_store:
  provider: "chroma"
  persist_directory: "./data/db/chroma"
  collection_name: "knowledge_hub"

retrieval:
  dense_enabled: false
  dense_provider: "disabled"
  dense_failure_policy: "degrade"
  dense_top_k: 20
  sparse_top_k: 20
  fusion_top_k: 10
  rrf_k: 60

rerank:
  enabled: false
  provider: "none"
  model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  top_k: 5

evaluation:
  enabled: false
  provider: "custom"
  metrics:
    - "hit_rate"
    - "mrr"
    - "faithfulness"

observability:
  log_level: "INFO"
  trace_enabled: true
  trace_file: "./logs/traces.jsonl"
  structured_logging: true
