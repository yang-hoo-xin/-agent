runtime:
  gtfo:
    enabled: true
    game_executable: "C:/Software_ Entertainment software and its platform/steamapps/common/GTFO/GTFO.exe"
    working_directory: "C:/Software_ Entertainment software and its platform/steamapps/common/GTFO"
    launch_args: []
    log_paths:
      - "BepInEx/LogOutput.log"
      - "BepInEx/logs/LogOutput.log"
